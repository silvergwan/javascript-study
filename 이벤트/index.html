<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="button" value="hi" onclick="alert('hi')">
    <br/>
    클릭하면 hi 창이 뜨는 버튼을 생성
    <br />
    <input type="text" onchange="alert('changed')">
    <br />
    박그 안에 적은 텍스트가 바뀌면 changed 창을 띄움
    <br />
    <input type="text" onkeydown="alert('key down!')">
    <br />
    박스 안에 텍스트를 입력하면 key down! 창을 띄움
    <p>이처럼 onclick, onchange, onkeydown 와 같이 사용자와 상호작용하기 위한 속성들은 자바스크립트 문법을 필요로 함</p>
</body>
</html>
